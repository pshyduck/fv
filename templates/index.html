{% extends "base.html" %}

{% block content %}
<style>
    .zoom-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        height: 400px;
        margin: 50px auto;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        cursor: pointer;
    }

    .zoom-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .image-main { opacity: 1; transform: scale(1); z-index: 2; }
    .image-hover { opacity: 0; transform: scale(1.2); z-index: 1; }

    .zoom-container:hover .image-main { opacity: 0; transform: scale(1.5); }
    .zoom-container:hover .image-hover { opacity: 1; transform: scale(1); z-index: 3; }
</style>

<div class="text-center mt-5">
    <h2>Nézzen szét nálunk!</h2>
    <p class="text-muted">Húzza az egeret a képre a belső nézethez</p>
    
    <div class="zoom-container">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000" 
             class="zoom-image image-main" alt="Kinti nézet">
        
        <img src="https://images.unsplash.com/photo-1598928506311-c55ded91a20c?q=80&w=1000" 
             class="zoom-image image-hover" alt="Benti nézet">
    </div>
</div>
{% endblock %}
