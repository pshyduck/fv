{% extends "base.html" %}
{% block title %}Szobáink{% endblock %}

{% block content %}
<h1 class="mb-5 text-center">Válassza ki a pihenése helyszínét</h1>

<div class="row">
  {% for room in rooms %}
    <div class="col-md-6 mb-4"> <div class="card shadow">
        <img src="{{ url_for('static', filename=room.image) }}" class="card-img-top" alt="{{ room.name }}">
        <div class="card-body p-4">
          <h2 class="card-title h3">{{ room.name }}</h2>
          <p class="card-text text-muted">{{ room.description }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('room_detail', room_id=room.id) }}" class="btn btn-primary px-4">Foglalom</a>
            <span class="text-success fw-bold"><i class="bi bi-check-circle"></i> Szabad helyek</span>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
