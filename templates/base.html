<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Füzesi Vendégház{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root { --dark-wood: #4e342e; --accent-green: #689f38; --cream: #faf7f2; }
        body { font-family: 'Lora', serif; background-color: var(--cream); color: #2c1e1a; }
        .navbar { background-color: var(--dark-wood) !important; border-bottom: 4px solid var(--accent-green); }
        .navbar-brand { font-family: 'Playfair Display', serif; }
        .hero-section { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1510798831971-661eb04b3739?q=80&w=1200'); background-size: cover; color: white; padding: 80px 20px; border-radius: 15px; }
        .btn-primary { background-color: var(--accent-green); border: none; }
        .btn-primary:hover { background-color: #558b2f; }
        
        /* Naptár pirosítás */
        .flatpickr-day.disabled, .flatpickr-day.flatpickr-disabled {
            background: #f8d7da !important; color: #d9534f !important; text-decoration: line-through; opacity: 0.6;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">🌿 Füzesi Vendégház</a>
    <div class="ms-auto">
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('rooms') }}">Szobáink</a>
      
      <a class="btn btn-outline-light btn-sm ms-2" href="{{ url_for('contact') }}">Elérhetőségek</a>
      
    </div>
  </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show shadow-sm">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        {% endfor %}{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/hu.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
