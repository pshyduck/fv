<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vendégház{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        :root {
            --dark-wood: #4e342e;
            --accent-green: #689f38;
            --soft-cream: #faf7f2;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--soft-cream);
            color: #2c1e1a;
        }

        .navbar {
            background-color: var(--dark-wood) !important;
            border-bottom: 4px solid var(--accent-green);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
        }

        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1510798831971-661eb04b3739?q=80&w=1200');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 20px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .btn-booking {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn-booking:hover {
            background-color: #558b2f;
            color: white;
            transform: scale(1.05);
        }

        .feature-card {
            background: white;
            border-radius: 15px;
            border: 1px solid #e0d4c3;
            transition: 0.3s;
        }

        .feature-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">🌿 Füzesi Vendégház</a>
    <div class="ms-auto">
      <a class="btn btn-outline-light" href="{{ url_for('rooms') }}">Szobáink</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
